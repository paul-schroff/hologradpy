line-length = 88

[lint]
# Enable line-length rule
extend-select = ["E501", "D"]
ignore = [
    "D1",
    "D205", # Docstring summaries wrapping 
    "D212", # Avoids breaking sphinx napoleon extension
]

[lint.per-file-ignores]
# An example's module docstring is a sphinx-gallery header
"examples/*.py" = ["D415"]
"examples/**/*.py" = ["D415"]
# sphinx-gallery writes these copies from the sources above, so they carry the same header
"docs/auto_examples/**/*.py" = ["D415"]

[lint.pydocstyle]
convention = "google"
