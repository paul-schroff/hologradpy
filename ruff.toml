line-length = 88

[lint]
# Enable line-length rule
extend-select = ["E501", "D"]
ignore = [
    "D1",
    "D205", # Docstring summaries wrapping 
    "D212", # Avoids breaking sphinx napoleon extension
    "F722", # jaxtyping shape strings such as "H W 3" are not forward references
]

[lint.pydocstyle]
convention = "google"
